name: Harden & Build APK

on:
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v4
        with:
          repository: 'zzgs219G/apk-protect-action'
          ref: 'master'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK
        uses: nsetup/setup-sdk@v1
        with:
          ndk-version: '25.2.9519653'

      - name: Run Protection Pipeline
        run: |
          chmod +x scripts/pipelines/protect.sh
          bash scripts/pipelines/protect.sh \
            --apk-url "https://github.com/Hushchats1/unhardenapk/releases/download/v1.0.0/app-debug.apk" \
            --config '{"schema_version":1,"sigcheck":true,"dex2c":{"enabled":true,"rules_file":""},"stringenc":{"enabled":true,"rules_file":"**","dex2c_stub":true},"antidiff":true,"envcheck":true,"packer":{"enabled":false}}'

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: "output/*.apk"
