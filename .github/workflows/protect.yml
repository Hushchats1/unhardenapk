name: Harden & Build APK

on:
  workflow_dispatch:

jobs:
  protect-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Run Protection Pipeline
        uses: zzgs219G/apk-protect-action@main
        with:
          apk_url: "https://github.com/Hushchats1/unhardenapk/releases/download/v1.0.0/app-debug.apk"
          protect_config: |
            {
              "schema_version": 1,
              "sigcheck": true,
              "dex2c": { "enabled": true, "rules_file": "" },
              "stringenc": { "enabled": true, "rules_file": "**", "dex2c_stub": true },
              "antidiff": true,
              "envcheck": true,
              "packer": { "enabled": false }
            }

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: "*.apk"
